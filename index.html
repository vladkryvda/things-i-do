<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>things i make</title>
  
  <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%23ffffff' d='M15 0H1v16l7-7l7 7z'/></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'JetBrains Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #000000;
      color: #e5e5e5;
    }
    .thin-border {
      border: 1px solid #161616;
    }
    .thin-border-b {
      border-bottom: 1px solid #111111;
    }
    @keyframes subtle-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .animate-alert {
      animation: subtle-pulse 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen py-16 px-4 selection:bg-neutral-800" ondblclick="triggerAuthModal()">

  <!-- МОНОХРОМНИЙ ВІДЖЕТ СТРІКА (ЛИШЕ ДЛЯ АДМІНА) -->
  <div id="streak-widget" class="fixed top-5 left-5 hidden z-40 select-none">
    <div class="thin-border bg-[#050505] px-2.5 py-1.5 flex items-center space-x-2 text-[10px] tracking-wider">
      <!-- Тонка мінімалістична іконка вогню -->
      <svg class="w-3.5 h-3.5 text-neutral-400 stroke-[1.2]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2c0 4-4 6.5-4 11a6 6 0 0012 0c0-4.5-4-7-4-11 0 2.5-1.5 4.5-2 4.5S12 4.5 12 2z"/>
      </svg>
      <span id="streak-count" class="text-neutral-200 font-medium">00 DAYS</span>
      <span class="text-neutral-700">|</span>
      <span id="streak-status" class="text-[9px] text-neutral-500">CHECKING...</span>
    </div>
  </div>

  <!-- Рамка при drag-and-drop -->
  <div id="drag-overlay" class="fixed inset-3 border border-dashed border-neutral-700 pointer-events-none hidden z-50"></div>

  <!-- Тонкі сповіщення в кутку -->
  <div id="toast" class="fixed top-4 right-4 text-[10px] text-neutral-400 bg-neutral-950 border border-neutral-800 px-3 py-1.5 hidden z-50"></div>

  <!-- Приховане вікно вводу пароля -->
  <div id="auth-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="thin-border bg-[#050505] p-5 max-w-xs w-full mx-4 space-y-3">
      <div class="text-[10px] text-neutral-500 flex justify-between">
        <span>AUTHORIZATION//</span>
        <span class="text-neutral-700">ESC TO CANCEL</span>
      </div>
      <input 
        type="password" 
        id="pass-input" 
        placeholder="enter password..." 
        class="w-full bg-black border border-neutral-800 p-2 text-xs text-neutral-200 outline-none focus:border-neutral-500"
        autocomplete="off"
      />
    </div>
  </div>

  <main class="max-w-lg mx-auto">

    <!-- Форма нового поста -->
    <form id="composer-form" class="hidden mb-16 thin-border bg-[#030303] p-2 space-y-2.5">
      <img id="preview-img" class="w-full h-auto object-contain max-h-[480px] bg-black" />
      
      <div class="flex items-center justify-between text-[10px] text-neutral-500 px-1 pt-1">
        <span id="status-text">READY</span>
        <span class="text-[9px] text-neutral-600">ENTER ↵</span>
      </div>

      <div class="px-1 border-t border-neutral-900 pt-2">
        <input 
          type="text" 
          id="caption-input" 
          placeholder="caption... (enter to submit, esc to cancel)" 
          class="w-full bg-transparent text-xs text-neutral-200 placeholder-neutral-700 outline-none"
          autocomplete="off"
        />
      </div>
    </form>

    <!-- Стрічка постів -->
    <div id="feed" class="space-y-16"></div>

  </main>

  <script>
    const SUPABASE_URL = 'https://zbhcetjbvhpyhadxovjk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaGNldGpidmhweWhhZHhvdmprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTEzMDMsImV4cCI6MjEwNTY4NzMwM30.Y78bcyOzrLWFev0fKc-RtTFrU4Il7M0nG2EdHU-XNC4';

    const ADMIN_PASSWORD = 'admin'; 

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isAdmin = localStorage.getItem('is_admin') === 'true';
    let currentBlob = null;
    let isUploading = false;

    const form = document.getElementById('composer-form');
    const previewImg = document.getElementById('preview-img');
    const captionInput = document.getElementById('caption-input');
    const statusText = document.getElementById('status-text');
    const dragOverlay = document.getElementById('drag-overlay');
    const feed = document.getElementById('feed');
    const authModal = document.getElementById('auth-modal');
    const passInput = document.getElementById('pass-input');
    const streakWidget = document.getElementById('streak-widget');

    if (window.location.hash === '#admin') {
      triggerAuthModal();
    }

    loadPosts();

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    // ЛОГІКА СТРІКА ТА ІКОНКИ ВКЛАДКИ
    function updateStreakAndBadge(posts) {
      if (!isAdmin) {
        streakWidget.classList.add('hidden');
        resetTabState();
        return;
      }

      streakWidget.classList.remove('hidden');

      // Форматування дат у формат YYYY-MM-DD
      const formatYMD = (d) => {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      const today = new Date();
      const todayStr = formatYMD(today);

      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = formatYMD(yesterday);

      // Унікальні дні, коли були пости
      const postDates = new Set(posts.map(p => formatYMD(new Date(p.created_at))));

      const hasPostedToday = postDates.has(todayStr);
      const hasPostedYesterday = postDates.has(yesterdayStr);

      let streak = 0;
      let checkDate = new Date();

      if (hasPostedToday) {
        // Починаємо рахувати з сьогодні
        while (postDates.has(formatYMD(checkDate))) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        }
      } else if (hasPostedYesterday) {
        // Сьогодні поста ще немає, але стрік живий (вчора був пост)
        checkDate.setDate(checkDate.getDate() - 1);
        while (postDates.has(formatYMD(checkDate))) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        }
      } else {
        // Пропущено день — стрік обнулено
        streak = 0;
      }

      // Оновлення віджета
      const streakCountEl = document.getElementById('streak-count');
      const streakStatusEl = document.getElementById('streak-status');

      streakCountEl.innerText = `${String(streak).padStart(2, '0')} ${streak === 1 ? 'DAY' : 'DAYS'}`;

      if (hasPostedToday) {
        streakStatusEl.innerHTML = `<span class="text-neutral-300">● POSTED</span>`;
        streakStatusEl.classList.remove('animate-alert');
        resetTabState();
      } else {
        streakStatusEl.innerHTML = `<span class="text-neutral-500">○ DUE TODAY</span>`;
        streakStatusEl.classList.add('animate-alert');
        setTabNotification();
      }
    }

    // Зміна Favicon і назви вкладки для сповіщення адміна
    function setTabNotification() {
      document.title = '(!) things i make';
      const favicon = document.getElementById('favicon');
      if (favicon) {
        // SVG з маленькою білою крапкою сповіщення в правому верхньому кутку
        favicon.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%23ffffff' d='M15 0H1v16l7-7l7 7z'/><circle cx='13' cy='3' r='2.2' fill='%23ffffff' stroke='%23000000' stroke-width='0.6'/></svg>`;
      }
    }

    function resetTabState() {
      document.title = 'things i make';
      const favicon = document.getElementById('favicon');
      if (favicon) {
        // Стандартний чистий SVG
        favicon.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%23ffffff' d='M15 0H1v16l7-7l7 7z'/></svg>`;
      }
    }

    // АВТОРИЗАЦІЯ
    function triggerAuthModal() {
      if (isAdmin) {
        showToast('[ALREADY_LOGGED_IN_AS_ADMIN]');
        return;
      }
      authModal.classList.remove('hidden');
      passInput.value = '';
      setTimeout(() => passInput.focus(), 50);
    }

    passInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (passInput.value === ADMIN_PASSWORD) {
          localStorage.setItem('is_admin', 'true');
          isAdmin = true;
          authModal.classList.add('hidden');
          showToast('[ADMIN_ACCESS_GRANTED]');
          loadPosts();
        } else {
          showToast('[WRONG_KEY]');
          passInput.value = '';
        }
      } else if (e.key === 'Escape') {
        authModal.classList.add('hidden');
      }
    });

    // СТИСНЕННЯ КАРТИНОК
    async function compressImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(img.src);
          let w = img.width;
          let h = img.height;
          const max = 1800;

          if (w > max) {
            h = Math.round((h * max) / w);
            w = max;
          }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);

          canvas.toBlob((blob) => resolve(blob || file), 'image/webp', 0.8);
        };
        img.onerror = () => resolve(file);
      });
    }

    async function handleFile(file) {
      if (!isAdmin) {
        showToast('[UNAUTHORIZED: DOUBLE CLICK TO LOGIN]');
        return;
      }
      if (!file || !file.type.startsWith('image/')) return;

      statusText.innerText = 'OPTIMIZING...';
      form.classList.remove('hidden');
      previewImg.src = URL.createObjectURL(file);

      currentBlob = await compressImage(file);
      const sizeKb = (currentBlob.size / 1024).toFixed(0);
      statusText.innerText = `READY [${sizeKb}KB]`;

      window.scrollTo({ top: 0, behavior: 'smooth' });
      captionInput.value = '';
      setTimeout(() => captionInput.focus(), 50);
    }

    // ВСТАВКА ТА DRAG AND DROP
    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.includes('image')) {
          handleFile(item.getAsFile());
          break;
        }
      }
    });

    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      dragOverlay.classList.remove('hidden');
    });

    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dragOverlay.classList.add('hidden');
      }
    });

    window.addEventListener('dragover', (e) => e.preventDefault());

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dragOverlay.classList.add('hidden');
      if (e.dataTransfer.files?.[0]) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // ПУБЛІКАЦІЯ ПОСТА
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentBlob || isUploading) return;

      isUploading = true;
      captionInput.disabled = true;
      statusText.innerText = 'UPLOADING TO STORAGE...';

      try {
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.webp`;

        const { error: uploadError } = await supabaseClient.storage
          .from('shots')
          .upload(fileName, currentBlob, { contentType: 'image/webp' });

        if (uploadError) throw new Error('Storage: ' + uploadError.message);

        statusText.innerText = 'SAVING RECORD...';

        const { data: { publicUrl } } = supabaseClient.storage
          .from('shots')
          .getPublicUrl(fileName);

        const caption = captionInput.value.trim();
        const { error: dbError } = await supabaseClient
          .from('posts')
          .insert([{ image_url: publicUrl, caption: caption }]);

        if (dbError) throw new Error('Database: ' + dbError.message);

        closeForm();
        await loadPosts();
        showToast('[PUBLISHED]');
      } catch (err) {
        statusText.innerText = 'ERROR: ' + err.message;
        console.error(err);
      } finally {
        isUploading = false;
        captionInput.disabled = false;
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !form.classList.contains('hidden')) {
        closeForm();
      }
    });

    function closeForm() {
      currentBlob = null;
      previewImg.src = '';
      captionInput.value = '';
      form.classList.add('hidden');
    }

    // ЗАВАНТАЖЕННЯ СТРІЧКИ
    async function loadPosts() {
      const { data, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data) return;

      // Оновлюємо стрік та статус вкладки
      updateStreakAndBadge(data);

      feed.innerHTML = data.map(post => `
        <article class="group thin-border bg-[#020202]">
          <div class="px-2.5 py-1.5 thin-border-b bg-black flex justify-between items-center text-[10px] text-neutral-600 select-none">
            <span>${formatDate(post.created_at)}</span>
            ${isAdmin ? `<button onclick="deletePost(${post.id}, '${post.image_url}')" class="opacity-0 group-hover:opacity-100 hover:text-neutral-300">×</button>` : ''}
          </div>
          <div class="p-1">
            <img src="${post.image_url}" alt="" loading="lazy" class="w-full h-auto object-contain bg-black">
          </div>
          ${post.caption ? `
            <div class="px-3 py-2 text-xs text-neutral-400 font-light leading-relaxed">
              ${escape(post.caption)}
            </div>
          ` : ''}
        </article>
      `).join('');
    }

    // ВИДАЛЕННЯ
    async function deletePost(id, imageUrl) {
      if (!confirm('DELETE_RECORD?')) return;
      
      await supabaseClient.from('posts').delete().eq('id', id);
      const fileName = imageUrl.split('/').pop();
      if (fileName) {
        await supabaseClient.storage.from('shots').remove([fileName]);
      }
      loadPosts();
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ` +
             `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function escape(str) {
      const d = document.createElement('div');
      d.innerText = str;
      return d.innerHTML;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>things i make</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'JetBrains Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #000000;
      color: #e5e5e5;
    }
    .thin-border {
      border: 1px solid #161616;
    }
    .thin-border-b {
      border-bottom: 1px solid #111111;
    }
    textarea {
      field-sizing: content;
      resize: none;
    }
  </style>
</head>
<body class="min-h-screen py-16 px-4 selection:bg-neutral-800" ondblclick="triggerAuthModal()">

  <!-- Кнопка створення поста справа внизу -->
  <button 
    id="create-btn" 
    onclick="openTextComposer()" 
    title="Create post"
    class="fixed bottom-6 right-6 z-40 w-11 h-11 thin-border bg-[#050505] hover:bg-[#111111] text-neutral-400 hover:text-neutral-100 flex items-center justify-center transition-all duration-150 active:scale-95 shadow-xl shadow-black/80"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="6" y1="12" x2="18" y2="12"></line>
    </svg>
  </button>

  <!-- Рамка при drag-and-drop -->
  <div id="drag-overlay" class="fixed inset-3 border border-dashed border-neutral-700 pointer-events-none hidden z-50"></div>

  <!-- Тонкі сповіщення в кутку -->
  <div id="toast" class="fixed top-4 right-4 text-[10px] text-neutral-400 bg-neutral-950 border border-neutral-800 px-3 py-1.5 hidden z-50"></div>

  <!-- Лайтбокс (відкриття фото на весь екран) -->
  <div id="lightbox" class="fixed inset-0 bg-black/95 z-[60] hidden flex items-center justify-center p-4 cursor-zoom-out" onclick="closeLightbox()">
    <img id="lightbox-img" class="max-w-full max-h-full object-contain select-none shadow-2xl" src="" alt="Full view" />
    <span class="absolute top-4 right-6 text-[10px] text-neutral-600">ESC / CLICK TO CLOSE</span>
  </div>

  <!-- Приховане вікно вводу пароля (відкривається подвійним кліком) -->
  <div id="auth-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="thin-border bg-[#050505] p-5 max-w-xs w-full mx-4 space-y-3">
      <div class="text-[10px] text-neutral-500 flex justify-between">
        <span>AUTHORIZATION//</span>
        <span class="text-neutral-700">ESC TO CANCEL</span>
      </div>
      <input 
        type="password" 
        id="pass-input" 
        placeholder="enter password..." 
        class="w-full bg-black border border-neutral-800 p-2 text-xs text-neutral-200 outline-none focus:border-neutral-500"
        autocomplete="off"
      />
    </div>
  </div>

  <main class="max-w-lg mx-auto">

    <!-- Форма нового поста -->
    <form id="composer-form" class="hidden mb-16 thin-border bg-[#030303] p-2 space-y-2.5">
      <img id="preview-img" class="w-full h-auto object-contain max-h-[480px] bg-black hidden" />
      
      <div class="flex items-center justify-between text-[10px] text-neutral-500 px-1 pt-1">
        <span id="status-text">READY</span>
        <span class="text-[9px] text-neutral-600">⌘+ENTER TO POST • ENTER FOR NEWLINE</span>
      </div>

      <div class="px-1 border-t border-neutral-900 pt-2 flex flex-col gap-1">
        <textarea 
          id="caption-input" 
          rows="2"
          placeholder="what did you build / fix? (enter for newline, ⌘+enter to post)..." 
          class="w-full bg-transparent text-xs text-neutral-200 placeholder-neutral-700 outline-none leading-relaxed block"
        ></textarea>
        <!-- Лічильник символів (Anti-essay) -->
        <div class="flex justify-end items-center px-0.5">
          <span id="char-counter" class="text-[9px] text-neutral-600 select-none">280</span>
        </div>
      </div>
    </form>

    <!-- Стрічка постів -->
    <div id="feed" class="space-y-16"></div>

  </main>

<script>
    // 1. ВАШІ ДАНІ SUPABASE
    const SUPABASE_URL = 'https://zbhcetjbvhpyhadxovjk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaGNldGpidmhweWhhZHhvdmprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTEzMDMsImV4cCI6MjEwNTY4NzMwM30.Y78bcyOzrLWFev0fKc-RtTFrU4Il7M0nG2EdHU-XNC4';

    // 2. ВСТАНОВІТЬ СВІЙ ПАРОЛЬ ТУТ:
    const ADMIN_PASSWORD = 'admin'; 

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isAdmin = localStorage.getItem('is_admin') === 'true';
    let currentBlob = null;
    let isUploading = false;

    const form = document.getElementById('composer-form');
    const previewImg = document.getElementById('preview-img');
    const captionInput = document.getElementById('caption-input');
    const charCounter = document.getElementById('char-counter');
    const statusText = document.getElementById('status-text');
    const dragOverlay = document.getElementById('drag-overlay');
    const feed = document.getElementById('feed');
    const authModal = document.getElementById('auth-modal');
    const passInput = document.getElementById('pass-input');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    if (window.location.hash === '#admin') {
      triggerAuthModal();
    }

    loadPosts();

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    // ЛОГІКА АВТОРИЗАЦІЇ
    function triggerAuthModal() {
      if (isAdmin) {
        showToast('[ALREADY_LOGGED_IN]');
        return;
      }
      authModal.classList.remove('hidden');
      passInput.value = '';
      setTimeout(() => passInput.focus(), 50);
    }

    passInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (passInput.value === ADMIN_PASSWORD) {
          localStorage.setItem('is_admin', 'true');
          isAdmin = true;
          authModal.classList.add('hidden');
          showToast('[ADMIN_ACCESS_GRANTED]');
          loadPosts();
        } else {
          showToast('[WRONG_KEY]');
          passInput.value = '';
        }
      } else if (e.key === 'Escape') {
        authModal.classList.add('hidden');
      }
    });

    // ВІДКРИТТЯ ФОРМИ ДЛЯ ТЕКСТОВОГО ПОСТА
    function openTextComposer() {
      if (!isAdmin) {
        triggerAuthModal();
        return;
      }

      currentBlob = null;
      previewImg.src = '';
      previewImg.classList.add('hidden');

      statusText.innerText = 'TEXT ONLY';
      form.classList.remove('hidden');
      captionInput.value = '';
      updateCharCounter();

      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => captionInput.focus(), 50);
    }

    // LIGHTBOX
    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    }

    function closeLightbox() {
      lightbox.classList.add('hidden');
      lightboxImg.src = '';
      document.body.classList.remove('overflow-hidden');
    }

    // СТИСНЕННЯ КАРТИНОК У WEBP
    async function compressImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(img.src);
          let w = img.width;
          let h = img.height;
          const max = 2000;

          if (w > max) {
            h = Math.round((h * max) / w);
            w = max;
          }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);

          canvas.toBlob((blob) => resolve(blob || file), 'image/webp', 0.85);
        };
        img.onerror = () => resolve(file);
      });
    }

    async function handleFile(file) {
      if (!isAdmin) {
        showToast('[UNAUTHORIZED: DOUBLE CLICK TO LOGIN]');
        return;
      }
      if (!file || !file.type.startsWith('image/')) return;

      statusText.innerText = 'OPTIMIZING...';
      form.classList.remove('hidden');
      previewImg.classList.remove('hidden');
      previewImg.src = URL.createObjectURL(file);

      currentBlob = await compressImage(file);
      const sizeKb = (currentBlob.size / 1024).toFixed(0);
      statusText.innerText = `READY [${sizeKb}KB]`;

      window.scrollTo({ top: 0, behavior: 'smooth' });
      captionInput.value = '';
      updateCharCounter();
      setTimeout(() => captionInput.focus(), 50);
    }

    // ВСТАВКА (CTRL + V / CMD + V)
    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;

      for (const item of items) {
        if (item.type.includes('image')) {
          handleFile(item.getAsFile());
          break;
        }
      }
    });

    // DRAG AND DROP
    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      dragOverlay.classList.remove('hidden');
    });

    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dragOverlay.classList.add('hidden');
      }
    });

    window.addEventListener('dragover', (e) => e.preventDefault());

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dragOverlay.classList.add('hidden');
      if (e.dataTransfer.files?.[0]) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // ОНОВЛЕННЯ ЛІЧИЛЬНИКА СИМВОЛІВ
    function updateCharCounter() {
      const len = captionInput.value.length;
      const remaining = 280 - len;
      charCounter.innerText = remaining;

      if (remaining < 0) {
        charCounter.className = 'text-[9px] text-red-500 font-medium select-none';
      } else if (remaining <= 20) {
        charCounter.className = 'text-[9px] text-amber-500 select-none';
      } else {
        charCounter.className = 'text-[9px] text-neutral-600 select-none';
      }
    }

    captionInput.addEventListener('input', updateCharCounter);

    // ОБРОБКА КЛАВІШ В ПОЛІ ВВОДУ
    captionInput.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        submitPost();
      }
    });

    // ВІДПРАВКА НА СЕРВЕР
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      submitPost();
    });

    async function submitPost() {
      const caption = captionInput.value.trim();
      
      // Не відправляти, якщо немає ні тексту, ні фото, або вже триває завантаження
      if ((!currentBlob && !caption) || isUploading) return;

      isUploading = true;
      captionInput.disabled = true;

      try {
        let publicUrl = null;

        if (currentBlob) {
          statusText.innerText = 'UPLOADING TO STORAGE...';
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.webp`;

          const { error: uploadError } = await supabaseClient.storage
            .from('shots')
            .upload(fileName, currentBlob, { contentType: 'image/webp' });

          if (uploadError) throw new Error('Storage: ' + uploadError.message);

          const { data: urlData } = supabaseClient.storage
            .from('shots')
            .getPublicUrl(fileName);

          publicUrl = urlData.publicUrl;
        }

        statusText.innerText = 'SAVING RECORD...';

        const { error: dbError } = await supabaseClient
          .from('posts')
          .insert([{ 
            image_url: publicUrl, 
            caption: caption || null 
          }]);

        if (dbError) throw new Error('Database: ' + dbError.message);

        closeForm();
        await loadPosts();
        showToast('[PUBLISHED]');
      } catch (err) {
        statusText.innerText = 'ERROR: ' + err.message;
        console.error(err);
      } finally {
        isUploading = false;
        captionInput.disabled = false;
      }
    }

    // ESCAPE ДЛЯ ЗАКРИТТЯ ЛАЙТБОКСУ / ФОРМИ
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!lightbox.classList.contains('hidden')) {
          closeLightbox();
        } else if (!form.classList.contains('hidden')) {
          closeForm();
        }
      }
    });

    function closeForm() {
      currentBlob = null;
      previewImg.src = '';
      previewImg.classList.add('hidden');
      captionInput.value = '';
      updateCharCounter();
      form.classList.add('hidden');
    }

    // ЗАВАНТАЖЕННЯ СТРІЧКИ
    async function loadPosts() {
      const { data, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data) return;

      feed.innerHTML = data.map(post => `
        <article class="group thin-border bg-[#020202]">
          <div class="px-2.5 py-1.5 thin-border-b bg-black flex justify-between items-center text-[10px] text-neutral-600 select-none">
            <span>${formatDate(post.created_at)}</span>
            ${isAdmin ? `<button onclick="deletePost(${post.id}, '${post.image_url || ''}')" class="opacity-0 group-hover:opacity-100 hover:text-red-400">DELETE ×</button>` : ''}
          </div>
          ${post.image_url ? `
            <div class="p-1">
              <img 
                src="${post.image_url}" 
                alt="Screenshot" 
                loading="lazy" 
                onclick="openLightbox('${post.image_url}')"
                class="w-full h-auto object-contain bg-black cursor-zoom-in hover:opacity-95 transition-opacity"
              />
            </div>
          ` : ''}
          ${post.caption ? `
            <div class="px-3 py-2.5 text-xs text-neutral-300 font-light leading-relaxed whitespace-pre-line ${post.image_url ? 'border-t border-neutral-900/60' : ''}">
              ${formatCaption(post.caption)}
            </div>
          ` : ''}
        </article>
      `).join('');
    }

    // ВИДАЛЕННЯ
    async function deletePost(id, imageUrl) {
      if (!confirm('DELETE_RECORD?')) return;
      
      await supabaseClient.from('posts').delete().eq('id', id);
      
      if (imageUrl && imageUrl !== 'null' && imageUrl !== 'undefined') {
        const fileName = imageUrl.split('/').pop();
        if (fileName) {
          await supabaseClient.storage.from('shots').remove([fileName]);
        }
      }
      loadPosts();
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ` +
             `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function formatCaption(str) {
      const d = document.createElement('div');
      d.innerText = str;
      const safe = d.innerHTML;
      
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return safe.replace(urlRegex, (url) => 
        `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-neutral-400 underline underline-offset-4 hover:text-white">${url}</a>`
      );
    }
  </script>
</body>
</html>

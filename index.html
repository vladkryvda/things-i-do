<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>—</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'JetBrains Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #000000;
      color: #e5e5e5;
    }
    .thin-border {
      border: 1px solid #161616;
    }
    .thin-border-b {
      border-bottom: 1px solid #111111;
    }
  </style>
</head>
<body class="min-h-screen py-16 px-4 selection:bg-neutral-800" ondblclick="handleAdminAuth()">

  <!-- Візуальна рамка при перетягуванні файлу (тільки для адміна) -->
  <div id="drag-overlay" class="fixed inset-3 border border-dashed border-neutral-700 pointer-events-none hidden z-50"></div>

  <main class="max-w-lg mx-auto">

    <!-- Форма вводу: з'являється ТІЛЬКИ після вставки/перетягування і ТІЛЬКИ у адміна -->
    <div id="composer" class="hidden mb-16 thin-border bg-[#030303] p-2 space-y-2.5">
      <img id="preview-img" class="w-full h-auto object-contain max-h-[480px] bg-black" />
      <div class="flex items-center justify-between text-[10px] text-neutral-600 px-1 pt-1">
        <span id="compression-info">OPTIMIZING...</span>
        <span class="text-[9px]">ENTER ↵</span>
      </div>
      <div class="px-1 border-t border-neutral-900 pt-2">
        <input 
          type="text" 
          id="caption-input" 
          placeholder="caption... [enter to post, esc to discard]" 
          class="w-full bg-transparent text-xs text-neutral-200 placeholder-neutral-700 outline-none"
          autocomplete="off"
        />
      </div>
    </div>

    <!-- Стрічка з бази даних -->
    <div id="feed" class="space-y-16"></div>

  </main>

  <script>
    // Ваші дані з Supabase підключені:
    const SUPABASE_URL = 'https://zbhcetjbvhpyhadxovjk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaGNldGpidmhweWhhZHhvdmprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTEzMDMsImV4cCI6MjEwNTY4NzMwM30.Y78bcyOzrLWFev0fKc-RtTFrU4Il7M0nG2EdHU-XNC4';
    
    // ВАШ ПАРОЛЬ (можете змінити на будь-який інший):
    const ADMIN_PASSWORD = 'admin'; 

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isAdmin = localStorage.getItem('is_admin') === 'true';
    let currentBlob = null;
    let isUploading = false;

    const composer = document.getElementById('composer');
    const previewImg = document.getElementById('preview-img');
    const captionInput = document.getElementById('caption-input');
    const compressionInfo = document.getElementById('compression-info');
    const dragOverlay = document.getElementById('drag-overlay');
    const feed = document.getElementById('feed');

    loadPosts();

    // 1. ВХІД В АДМІНКУ: Shift + A або подвійний клік на фон
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key.toLowerCase() === 'a') {
        handleAdminAuth();
      }
    });

    function handleAdminAuth() {
      if (isAdmin) return;
      const pass = prompt('ACCESS_KEY:');
      if (pass === ADMIN_PASSWORD) {
        localStorage.setItem('is_admin', 'true');
        isAdmin = true;
        alert('LOGGED_IN_AS_ADMIN');
        loadPosts();
      } else if (pass !== null) {
        alert('WRONG_KEY');
      }
    }

    // 2. АВТОМАТИЧНЕ СТИСНЕННЯ (WebP ~70-100 КБ)
    async function compressImage(file, maxWidth = 1800, quality = 0.8) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(img.src);
          let w = img.width;
          let h = img.height;

          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          canvas.toBlob((blob) => {
            resolve(blob);
          }, 'image/webp', quality);
        };
      });
    }

    async function handleIncomingFile(file) {
      if (!isAdmin || !file || !file.type.startsWith('image/')) return;

      const originalSize = (file.size / 1024).toFixed(0);
      compressionInfo.innerText = `COMPRESSING [ORIGINAL: ${originalSize}KB]...`;
      composer.classList.remove('hidden');

      currentBlob = await compressImage(file);
      const newSize = (currentBlob.size / 1024).toFixed(0);

      previewImg.src = URL.createObjectURL(currentBlob);
      compressionInfo.innerText = `READY_WEBP [${newSize}KB]`;

      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => captionInput.focus(), 50);
    }

    // 3. CTRL + V
    window.addEventListener('paste', (e) => {
      if (!isAdmin) return;
      const items = e.clipboardData?.items;
      if (!items) return;

      for (const item of items) {
        if (item.type.includes('image')) {
          handleIncomingFile(item.getAsFile());
          break;
        }
      }
    });

    // 4. DRAG & DROP
    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      if (!isAdmin) return;
      e.preventDefault();
      dragCounter++;
      dragOverlay.classList.remove('hidden');
    });

    window.addEventListener('dragleave', (e) => {
      if (!isAdmin) return;
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dragOverlay.classList.add('hidden');
      }
    });

    window.addEventListener('dragover', (e) => e.preventDefault());

    window.addEventListener('drop', (e) => {
      if (!isAdmin) return;
      e.preventDefault();
      dragCounter = 0;
      dragOverlay.classList.add('hidden');
      if (e.dataTransfer.files?.[0]) {
        handleIncomingFile(e.dataTransfer.files[0]);
      }
    });

    // 5. ВІДПРАВКА (ENTER)
    captionInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!currentBlob || isUploading) return;

        isUploading = true;
        captionInput.disabled = true;
        compressionInfo.innerText = 'SYNCING_TO_CLOUD...';

        try {
          const fileName = `${Date.now()}.webp`;
          const { error: uploadError } = await supabase.storage
            .from('shots')
            .upload(fileName, currentBlob, { contentType: 'image/webp' });

          if (uploadError) throw uploadError;

          const { data: { publicUrl } } = supabase.storage
            .from('shots')
            .getPublicUrl(fileName);

          const caption = captionInput.value.trim();
          const { error: dbError } = await supabase
            .from('posts')
            .insert([{ image_url: publicUrl, caption: caption }]);

          if (dbError) throw dbError;

          closeComposer();
          await loadPosts();
        } catch (err) {
          alert('Upload failed: ' + err.message);
        } finally {
          isUploading = false;
          captionInput.disabled = false;
        }
      } else if (e.key === 'Escape') {
        closeComposer();
      }
    });

    function closeComposer() {
      currentBlob = null;
      previewImg.src = '';
      captionInput.value = '';
      composer.classList.add('hidden');
    }

    // 6. ЗАВАНТАЖЕННЯ СТРІЧКИ
    async function loadPosts() {
      const { data, error } = await supabase
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data) return;

      feed.innerHTML = data.map(post => `
        <article class="group thin-border bg-[#020202]">
          <div class="px-2.5 py-1.5 thin-border-b bg-black flex justify-between items-center text-[10px] text-neutral-600 select-none">
            <span>${formatDate(post.created_at)}</span>
            ${isAdmin ? `<button onclick="deletePost(${post.id}, '${post.image_url}')" class="opacity-0 group-hover:opacity-100 hover:text-neutral-300">×</button>` : ''}
          </div>
          <div class="p-1">
            <img src="${post.image_url}" alt="" loading="lazy" class="w-full h-auto object-contain bg-black">
          </div>
          ${post.caption ? `
            <div class="px-3 py-2 text-xs text-neutral-400 font-light leading-relaxed">
              ${escape(post.caption)}
            </div>
          ` : ''}
        </article>
      `).join('');
    }

    // 7. ВИДАЛЕННЯ
    async function deletePost(id, imageUrl) {
      if (!confirm('DELETE_RECORD?')) return;
      
      await supabase.from('posts').delete().eq('id', id);
      
      const fileName = imageUrl.split('/').pop();
      if (fileName) {
        await supabase.storage.from('shots').remove([fileName]);
      }

      loadPosts();
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ` +
             `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function escape(str) {
      const d = document.createElement('div');
      d.innerText = str;
      return d.innerHTML;
    }
  </script>
</body>
</html>
